name: Cache
description: Restore and save a cache

inputs:
  image:
    required: false
    default: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
  path:
    required: true
  key:
    required: true
  platform:
    required: false
    default: "true"
  prefix:
    description: Key segments before the platform segment
    required: false
    default: ""
  suffix:
    description: Key segments after the key
    required: false
    default: ""
  restore-keys:
    required: false
    default: ""

outputs:
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: resolved
      shell: bash
      env:
        INPUT_KEY: ${{ inputs.key }}
        INPUT_RESTORE_KEYS: ${{ inputs.restore-keys }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_SUFFIX: ${{ inputs.suffix }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: bash "${{ gitea.action_path }}/resolve.sh"

    - id: cache
      uses: ${{ inputs.image }}
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.resolved.outputs.key }}
        restore-keys: ${{ steps.resolved.outputs.restore-keys }}
