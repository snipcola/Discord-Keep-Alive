name: Cache
description: Restore and save a cache

inputs:
  image:
    required: false
    default: actions/cache@v6.1.0
  path:
    required: true
  key:
    required: true
  platform:
    required: false
    default: "true"
  restore-keys:
    required: false
    default: ""

outputs:
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: resolved
      shell: bash
      env:
        INPUT_KEY: ${{ inputs.key }}
        INPUT_RESTORE_KEYS: ${{ inputs.restore-keys }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        prefix=
        if [ "${INPUT_PLATFORM}" = "true" ]; then
          os="${RUNNER_OS:-unknown}"
          arch="${RUNNER_ARCH:-unknown}"
          prefix="${os}-${arch}-"
        fi

        {
          echo "key=${prefix}${INPUT_KEY}"
          echo "restore-keys<<EOF"
          while IFS= read -r line || [ -n "${line}" ]; do
            [ -n "${line}" ] || continue
            printf '%s\n' "${prefix}${line}"
          done <<< "${INPUT_RESTORE_KEYS}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - id: cache
      uses: ${{ inputs.image }}
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.resolved.outputs.key }}
        restore-keys: ${{ steps.resolved.outputs.restore-keys }}
