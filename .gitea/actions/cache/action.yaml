name: Cache
description: Restore and save a cache

inputs:
  image:
    required: false
    default: actions/cache@v6.1.0
  path:
    required: true
  key:
    required: true
  platform:
    required: false
    default: "true"
  prefix:
    description: Segment(s) before platform (and key), joined with '-'
    required: false
    default: ""
  suffix:
    description: Segment(s) after key, joined with '-'
    required: false
    default: ""
  restore-keys:
    required: false
    default: ""

outputs:
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: resolved
      shell: bash
      env:
        INPUT_KEY: ${{ inputs.key }}
        INPUT_RESTORE_KEYS: ${{ inputs.restore-keys }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_SUFFIX: ${{ inputs.suffix }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        trim() {
          local s="${1-}"
          s="${s#"${s%%[![:space:]]*}"}"
          s="${s%"${s##*[![:space:]]}"}"
          printf '%s' "${s}"
        }

        join_segments() {
          local out="" seg
          for seg in "$@"; do
            seg="$(trim "${seg}")"
            [ -n "${seg}" ] || continue
            if [ -n "${out}" ]; then
              out="${out}-${seg}"
            else
              out="${seg}"
            fi
          done
          printf '%s' "${out}"
        }

        prefix="$(trim "${INPUT_PREFIX-}")"
        suffix="$(trim "${INPUT_SUFFIX-}")"
        key_core="$(trim "${INPUT_KEY}")"
        if [ -z "${key_core}" ]; then
          echo "cache key is empty" >&2
          exit 1
        fi

        platform_seg=
        if [ "${INPUT_PLATFORM}" = "true" ]; then
          platform_seg="runner-${RUNNER_OS:-unknown}-${RUNNER_ARCH:-unknown}"
        fi

        full_key="$(join_segments "${prefix}" "${platform_seg}" "${key_core}" "${suffix}")"
        if [ -z "${full_key}" ]; then
          echo "resolved cache key is empty" >&2
          exit 1
        fi

        {
          echo "key=${full_key}"
          echo "restore-keys<<EOF"
          while IFS= read -r line || [ -n "${line}" ]; do
            line="$(trim "${line}")"
            [ -n "${line}" ] || continue
            printf '%s\n' "$(join_segments "${prefix}" "${platform_seg}" "${line}" "${suffix}")"
          done <<< "${INPUT_RESTORE_KEYS}"
          echo "EOF"
        } >> "${GITEA_OUTPUT}"

    - id: cache
      uses: ${{ inputs.image }}
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.resolved.outputs.key }}
        restore-keys: ${{ steps.resolved.outputs.restore-keys }}
