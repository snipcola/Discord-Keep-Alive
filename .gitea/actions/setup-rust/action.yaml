name: Setup Rust
description: Cache rustup and install the pinned toolchain

inputs:
  image:
    required: false
    default: https://github.com/actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

runs:
  using: composite
  steps:
    - uses: ./.gitea/actions/cache
      with:
        path: ~/.rustup
        key: rustup-toolchain-${{ hashFiles('rust-toolchain.toml') }}

    - uses: ${{ inputs.image }}
      with:
        cache-directories: ~/.cargo/advisory-dbs
