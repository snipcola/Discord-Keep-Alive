name: Setup Rust
description: Cache rustup and install the pinned toolchain

inputs:
  image:
    required: false
    default: https://github.com/actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
  targets:
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Cache keys can't contain commas, so hash the targets.
    - id: fp
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: echo "targets=$(printf '%s' "${TARGETS}" | sha256sum | cut -c1-16)" >>"${GITEA_OUTPUT}"

    - uses: ./.gitea/actions/cache
      with:
        path: ~/.rustup
        key: rustup-toolchain-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.fp.outputs.targets }}

    # rust-cache doesn't rewrite an entry restored on an exact key match,
    # so bins and targets are cached separately to avoid stale contents.
    - uses: ${{ inputs.image }}
      with:
        target: ${{ inputs.targets }}
        build-warnings: deny
        cache-bin: "false"
        cache-targets: "false"
        cache-directories: ~/.cargo/advisory-dbs
