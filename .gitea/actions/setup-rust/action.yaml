name: Setup Rust
description: Cache rustup and install the pinned toolchain

inputs:
  image:
    required: false
    default: https://github.com/actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
  targets:
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Cache keys can't contain commas, so hash the targets.
    - id: fp
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        source "${{ gitea.action_path }}/../../scripts/common.sh"
        echo "targets=$(printf '%s' "${TARGETS}" | fingerprint)" >>"${GITEA_OUTPUT}"

    - uses: ./.gitea/actions/cache
      with:
        path: ~/.rustup
        key: rustup-toolchain-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.fp.outputs.targets }}

    # rust-cache doesn't rewrite an entry restored on an exact key match,
    # so bins and targets are cached separately to avoid stale contents.
    - uses: ${{ inputs.image }}
      with:
        target: ${{ inputs.targets }}
        build-warnings: deny
        cache-bin: "false"
        cache-targets: "false"
        cache-directories: ~/.cargo/advisory-dbs
