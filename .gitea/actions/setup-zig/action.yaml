name: Setup Zig
description: Install a pinned Zig toolchain

inputs:
  image:
    required: false
    default: https://github.com/mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
  version:
    required: true

runs:
  using: composite
  steps:
    # The tool cache is local disk only, so it never survives a fresh runner.
    - uses: ${{ inputs.image }}
      with:
        version: ${{ inputs.version }}
        use-tool-cache: false
