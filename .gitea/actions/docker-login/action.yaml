name: Docker Login
description: Log in to container registries

inputs:
  image:
    required: false
    default: https://github.com/docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
  registry-auth:
    description: YAML list of registry, username, and password entries
    required: true

runs:
  using: composite
  steps:
    - uses: ${{ inputs.image }}
      with:
        registry-auth: ${{ inputs.registry-auth }}
