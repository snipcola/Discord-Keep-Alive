name: Docker Login
description: Log in to a container registry

inputs:
  image:
    required: false
    default: https://github.com/docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
  registry:
    required: true
  username:
    required: true
  password:
    required: true

runs:
  using: composite
  steps:
    - uses: ${{ inputs.image }}
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
