name: Cargo target cache
description: Cache target directories for the host or the given Rust targets

inputs:
  targets:
    description: platform=rust-target lines; omit to cache the host target dir
    required: true
  key:
    description: Key segment identifying this set of targets
    required: true

outputs:
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}
  profiles:
    value: ${{ steps.paths.outputs.profiles }}

runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        source "${{ gitea.workspace }}/.gitea/scripts/common.sh"

        dir="${CARGO_TARGET_DIR:-target}"
        profiles=(debug)
        if [ -n "$(trim "${TARGETS}")" ]; then
          targets_parse "${TARGETS}"
          # Host build scripts and proc macros build into release/.
          profiles=(release "${TARGET_RUST[@]/%//release}")
        fi

        {
          echo "profiles<<EOF"
          printf "%s\n" "${profiles[@]/#/${dir}/}"
          echo "EOF"
          echo "flags=$(printf '%s' "${RUSTFLAGS-}" | sha256sum | cut -c1-16)"
        } >>"${GITEA_OUTPUT}"

    - id: cache
      uses: ./.gitea/actions/cache
      with:
        path: ${{ steps.paths.outputs.profiles }}
        key: cargo-target-${{ inputs.key }}-${{ steps.paths.outputs.flags }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: cargo-target-${{ inputs.key }}-${{ steps.paths.outputs.flags }}-
