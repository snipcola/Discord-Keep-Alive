name: BuildKit cache mounts
description: Persist Dockerfile cache mounts across CI runs

inputs:
  image:
    required: false
    default: reproducible-containers/buildkit-cache-dance@v3.4.0
  builder:
    required: true
  dockerfile:
    required: false
    default: "./Dockerfile"
  cache-dir:
    required: false
    default: .buildkit-cache-mounts
  key:
    required: false
    default: ""
  restore-keys:
    required: false
    default: cargo-mounts-
  cache-map:
    required: false
    default: |
      {
        "cargo-registry": { "target": "/usr/local/cargo/registry", "id": "cargo-registry" },
        "cargo-git": { "target": "/usr/local/cargo/git", "id": "cargo-git" }
      }

runs:
  using: composite
  steps:
    - id: cache
      uses: ./.gitea/actions/cache
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ inputs.key || format('cargo-mounts-{0}', hashFiles('**/Cargo.lock', 'rust-toolchain.toml')) }}
        restore-keys: ${{ inputs.restore-keys }}

    - uses: ${{ inputs.image }}
      with:
        builder: ${{ inputs.builder }}
        cache-map: ${{ inputs.cache-map }}
        cache-dir: ${{ inputs.cache-dir }}
        dockerfile: ${{ inputs.dockerfile }}
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}
