name: Docker Bake Push
description: Bake per platform, push digests, create multi-arch tags

inputs:
  bake_image:
    required: false
    default: https://github.com/docker/bake-action@v7.3.0
  context:
    required: false
    default: "."
  file:
    required: false
    default: "./Dockerfile"
  targets:
    description: platform=rust-target lines for multi-arch builds
    required: true
  version:
    required: true
  revision:
    required: false
    default: ""
  package:
    required: true
  source:
    required: false
    default: ""
  license:
    required: false
    default: ""
  refs:
    description: Image name bases without tags
    required: true
  cache-from:
    required: false
    default: ""
  cache-to:
    required: false
    default: ""
  push:
    description: Push digests and tags (false = build/cache only)
    required: false
    default: "true"
  also_latest:
    description: Also tag :latest in addition to :version
    required: false
    default: "true"
  provenance:
    required: false
    default: "false"
  sbom:
    required: false
    default: "false"

outputs:
  bake_file:
    value: ${{ steps.plan.outputs.bake_file }}
  platforms:
    value: ${{ steps.plan.outputs.platforms }}
  rust_targets:
    value: ${{ steps.plan.outputs.rust_targets }}
  target_names:
    value: ${{ steps.plan.outputs.target_names }}
  metadata:
    value: ${{ steps.bake.outputs.metadata }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.file }}
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.revision || gitea.sha }}
        PACKAGE: ${{ inputs.package }}
        SOURCE: ${{ inputs.source }}
        LICENSE: ${{ inputs.license }}
        REFS: ${{ inputs.refs }}
        CACHE_FROM: ${{ inputs.cache-from }}
        CACHE_TO: ${{ inputs.cache-to }}
        PUSH: ${{ inputs.push }}
        BAKE_FILE: ${{ runner.temp }}/docker-bake.json
      run: bash "${{ gitea.workspace }}/.gitea/scripts/docker-bake-plan.sh"

    - id: bake
      uses: ${{ inputs.bake_image }}
      env:
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: false
        DOCKER_BUILD_CHECKS_ANNOTATIONS: false
      with:
        source: .
        files: ${{ steps.plan.outputs.bake_file }}
        targets: default
        push: ${{ inputs.push }}
        provenance: ${{ inputs.provenance }}
        sbom: ${{ inputs.sbom }}

    - name: Create multi-arch manifests
      if: inputs.push == 'true'
      shell: bash
      env:
        METADATA: ${{ steps.bake.outputs.metadata }}
        REFS: ${{ inputs.refs }}
        VERSION: ${{ inputs.version }}
        ALSO_LATEST: ${{ inputs.also_latest }}
      run: bash "${{ gitea.workspace }}/.gitea/scripts/docker-manifest.sh"
