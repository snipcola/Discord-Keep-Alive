name: Gitea Tag
description: Create a repository tag via the Gitea API

inputs:
  version:
    required: true
  prefix:
    required: false
    default: ""
  message:
    required: false
    default: ""
  target:
    required: false
    default: ""
  conflict:
    description: skip, fail, or override if the tag points elsewhere
    required: false
    default: override
  latest:
    description: Also move the floating latest tag
    required: false
    default: "true"
  token:
    required: false
    default: ""
  api_url:
    required: false
    default: ""
  repository:
    required: false
    default: ""

outputs:
  tag:
    value: ${{ steps.tag.outputs.tag }}
  created:
    value: ${{ steps.tag.outputs.created }}

runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PREFIX: ${{ inputs.prefix }}
        MESSAGE: ${{ inputs.message }}
        TARGET: ${{ inputs.target || gitea.sha }}
        CONFLICT: ${{ inputs.conflict }}
        LATEST: ${{ inputs.latest }}
        TOKEN: ${{ inputs.token || gitea.token }}
        API_URL: ${{ inputs.api_url || gitea.api_url }}
        REPOSITORY: ${{ inputs.repository || gitea.repository }}
      run: bash "${{ gitea.action_path }}/run.sh"
