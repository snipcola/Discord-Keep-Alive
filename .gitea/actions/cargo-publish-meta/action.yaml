name: Cargo publish meta
description: Package version, publish decision, and image base refs

inputs:
  package_name:
    description: Defaults to the workspace default-member package
    required: false
    default: ""
  image_name:
    required: false
    default: ""
  manifest_path:
    required: false
    default: Cargo.toml
  force_release:
    description: Publish without a version bump or release marker
    required: false
    default: "false"
  release_marker:
    description: Commit subject substring that forces a same-version publish
    required: false
    default: "#release"
  local_registry:
    required: false
    default: ""
  local_user:
    required: false
    default: ""
  gh_user:
    required: true
  dh_user:
    required: true
  publish_local:
    description: Require local registry host and user
    required: false
    default: "true"

outputs:
  package_name:
    value: ${{ steps.meta.outputs.package_name }}
  version:
    value: ${{ steps.meta.outputs.version }}
  changed:
    value: ${{ steps.meta.outputs.changed }}
  reason:
    value: ${{ steps.meta.outputs.reason }}
  image_name:
    value: ${{ steps.meta.outputs.image_name }}
  local_registry:
    value: ${{ steps.meta.outputs.local_registry }}
  local_user:
    value: ${{ steps.meta.outputs.local_user }}
  local:
    value: ${{ steps.meta.outputs.local }}
  ghcr:
    value: ${{ steps.meta.outputs.ghcr }}
  docker:
    value: ${{ steps.meta.outputs.docker }}
  license:
    value: ${{ steps.meta.outputs.license }}
  repository:
    value: ${{ steps.meta.outputs.repository }}

runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        FORCE_RELEASE: ${{ inputs.force_release }}
        PACKAGE_NAME: ${{ inputs.package_name }}
        MANIFEST_PATH: ${{ inputs.manifest_path }}
        IMAGE_NAME: ${{ inputs.image_name }}
        RELEASE_MARKER: ${{ inputs.release_marker }}
        LOCAL_REGISTRY: ${{ inputs.local_registry || env.EXTERNAL_SERVER_DOMAIN }}
        SERVER_URL: ${{ gitea.server_url }}
        LOCAL_USER: ${{ inputs.local_user || gitea.repository_owner }}
        GH_USER: ${{ inputs.gh_user }}
        DH_USER: ${{ inputs.dh_user }}
        PUBLISH_LOCAL: ${{ inputs.publish_local }}
      run: bash "${{ gitea.action_path }}/run.sh"
