name: Cargo publish meta
description: Package version, publish decision, and image base refs

inputs:
  package_name:
    required: true
  image_name:
    required: true
  force_release:
    description: Publish even without version bump or release marker
    required: false
    default: "false"
  release_marker:
    description: Subject substring that forces a same-version publish
    required: false
    default: "#release"
  local_registry:
    required: true
  local_user:
    required: true
  gh_user:
    required: true
  dh_user:
    required: true

outputs:
  version:
    value: ${{ steps.meta.outputs.version }}
  changed:
    value: ${{ steps.meta.outputs.changed }}
  reason:
    value: ${{ steps.meta.outputs.reason }}
  local:
    value: ${{ steps.meta.outputs.local }}
  ghcr:
    value: ${{ steps.meta.outputs.ghcr }}
  docker:
    value: ${{ steps.meta.outputs.docker }}

runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        FORCE_RELEASE: ${{ inputs.force_release }}
        PACKAGE_NAME: ${{ inputs.package_name }}
        IMAGE_NAME: ${{ inputs.image_name }}
        RELEASE_MARKER: ${{ inputs.release_marker }}
        LOCAL_REGISTRY: ${{ inputs.local_registry }}
        LOCAL_USER: ${{ inputs.local_user }}
        GH_USER: ${{ inputs.gh_user }}
        DH_USER: ${{ inputs.dh_user }}
      run: |
        set -euo pipefail

        package_version() {
          cargo metadata --format-version 1 --no-deps --manifest-path "${1}/Cargo.toml" \
            | jq -er --arg name "${PACKAGE_NAME}" '.packages[] | select(.name == $name) | .version'
        }

        package_version_at() {
          local commit="$1" tree version rc=0

          tree="$(mktemp -d)"
          rmdir "${tree}"

          if ! git worktree add --detach "${tree}" "${commit}" >/dev/null 2>&1; then
            echo "Could not create worktree for ${commit}; refusing to publish." >&2
            return 1
          fi

          version="$(package_version "${tree}")" || rc=$?
          git worktree remove --force "${tree}" 2>/dev/null || true
          rm -rf "${tree}"

          if [ "${rc}" -ne 0 ]; then
            return "${rc}"
          fi
          printf '%s\n' "${version}"
        }

        version="$(package_version .)" || {
          echo "Could not resolve ${PACKAGE_NAME} version from HEAD; refusing to publish." >&2
          exit 1
        }

        reason=""
        prev=""
        parent=""
        if [ "${FORCE_RELEASE}" = "true" ]; then
          reason="force-release"
        elif ! git rev-parse --verify -q HEAD^ >/dev/null; then
          reason="no-previous-version"
        else
          parent="$(git rev-parse HEAD^)"
          prev="$(package_version_at "${parent}")" || {
            echo "Could not resolve ${PACKAGE_NAME} version from ${parent}; refusing to publish." >&2
            exit 1
          }

          if [ "${prev}" != "${version}" ]; then
            reason="version:${prev}->${version}"
          elif git log -1 --format=%s HEAD | grep -qF "${RELEASE_MARKER}"; then
            reason="commit-marker"
          fi
        fi

        if [ -n "${reason}" ]; then
          changed=true
        else
          changed=false
        fi

        {
          echo "version=${version}"
          echo "changed=${changed}"
          echo "reason=${reason}"
          echo "local=${LOCAL_REGISTRY}/${LOCAL_USER}/${IMAGE_NAME}"
          echo "ghcr=ghcr.io/${GH_USER}/${IMAGE_NAME}"
          echo "docker=docker.io/${DH_USER}/${IMAGE_NAME}"
        } >> "${GITHUB_OUTPUT}"

        if [ "${changed}" = true ]; then
          if [ -n "${parent}" ]; then
            echo "Publishing ${version} (${reason}; parent=${parent})."
          else
            echo "Publishing ${version} (${reason})."
          fi
        else
          echo "No version change and no ${RELEASE_MARKER} marker (${prev}@${parent} == ${version}); skipping image publish."
        fi
