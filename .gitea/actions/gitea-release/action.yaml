name: Gitea Release
description: Publish a release and a rolling `latest` release with their archives via the Gitea API

inputs:
  version:
    required: true
  tag:
    required: true
  package:
    required: true
  build_dir:
    description: Directory whose archives/ holds the versioned archives
    required: false
    default: build
  targets:
    description: platform=rust-target lines; platforms name the archives
    required: true
  body:
    description: Release notes; generated from the commit log when empty
    required: false
    default: ""
  repo_url:
    description: Public repository URL used for changelog and latest release links
    required: false
    default: ""
  latest:
    description: Also update the rolling latest release
    required: false
    default: "true"
  draft:
    required: false
    default: "false"
  prerelease:
    required: false
    default: "false"
  upload_jobs:
    description: Maximum concurrent asset uploads
    required: false
    default: "5"
  token:
    required: false
    default: ""
  api_url:
    required: false
    default: ""
  repository:
    required: false
    default: ""

outputs:
  release_id:
    value: ${{ steps.release.outputs.release_id }}

runs:
  using: composite
  steps:
    - id: notes
      if: inputs.body == ''
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        REPO_URL: ${{ inputs.repo_url || format('{0}/{1}', gitea.server_url, gitea.repository) }}
      run: |
        set -euo pipefail
        {
          echo "body<<CHANGELOG_EOF"
          bash "${{ gitea.workspace }}/.gitea/scripts/changelog.sh"
          echo "CHANGELOG_EOF"
        } >>"${GITEA_OUTPUT}"

    - id: release
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TAG: ${{ inputs.tag }}
        PACKAGE: ${{ inputs.package }}
        BUILD_DIR: ${{ inputs.build_dir }}
        TARGETS: ${{ inputs.targets }}
        BODY: ${{ inputs.body || steps.notes.outputs.body }}
        REPO_URL: ${{ inputs.repo_url || format('{0}/{1}', gitea.server_url, gitea.repository) }}
        LATEST: ${{ inputs.latest }}
        DRAFT: ${{ inputs.draft }}
        PRERELEASE: ${{ inputs.prerelease }}
        UPLOAD_JOBS: ${{ inputs.upload_jobs }}
        TOKEN: ${{ inputs.token || gitea.token }}
        API_URL: ${{ inputs.api_url || gitea.api_url }}
        REPOSITORY: ${{ inputs.repository || gitea.repository }}
      run: bash "${{ gitea.action_path }}/run.sh"
