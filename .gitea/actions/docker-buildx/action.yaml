name: Docker Buildx
description: Set up Docker Buildx

inputs:
  image:
    required: false
    default: https://github.com/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
  buildkit-image:
    required: false
    default: docker.io/moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
  driver-opts:
    required: false
    default: ""

outputs:
  name:
    value: ${{ steps.setup.outputs.name }}

runs:
  using: composite
  steps:
    - id: setup
      uses: ${{ inputs.image }}
      with:
        driver-opts: |
          image=${{ inputs.buildkit-image }}
          ${{ inputs.driver-opts }}
