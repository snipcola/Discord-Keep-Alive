name: Docker Buildx
description: Set up Docker Buildx

inputs:
  image:
    required: false
    default: https://github.com/docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
  buildkit-image:
    required: false
    default: docker.io/moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  driver-opts:
    required: false
    default: ""

outputs:
  name:
    value: ${{ steps.setup.outputs.name }}

runs:
  using: composite
  steps:
    - id: setup
      uses: ${{ inputs.image }}
      with:
        driver-opts: |
          image=${{ inputs.buildkit-image }}
          ${{ inputs.driver-opts }}
