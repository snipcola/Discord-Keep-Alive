name: Release

on:
  workflow_call:
    inputs:
      checkout:
        type: string
        required: true
      package_name:
        type: string
        required: true
      manifest_path:
        type: string
        required: false
        default: Cargo.toml
      image_name:
        type: string
        required: true
      targets:
        description: <platform>=<target>, separated by line
        type: string
        required: true
      local_registry:
        type: string
        required: false
        default: ""
      local_user:
        type: string
        required: true
      gh_user:
        type: string
        required: true
      dh_user:
        type: string
        required: true
      force_release:
        type: boolean
        required: false
        default: false
      release_marker:
        type: string
        required: false
        default: "#release"
      dockerfile:
        type: string
        required: false
        default: "./Dockerfile"
      context:
        type: string
        required: false
        default: "."
      runs_on:
        type: string
        required: false
        default: ubuntu
      docker_network:
        type: string
        required: false
        default: ""
      publish_local:
        type: boolean
        required: false
        default: true
      publish_ghcr:
        type: boolean
        required: false
        default: true
      publish_dockerhub:
        type: boolean
        required: false
        default: true
      create_tag:
        description: Create git version tag after successful publish
        type: boolean
        required: false
        default: true
      create_latest_tag:
        description: Tag image :latest; also git latest when create_tag is true
        type: boolean
        required: false
        default: true
      tag_prefix:
        type: string
        required: false
        default: "v"
      tag_message:
        type: string
        required: false
        default: ""
      tag_conflict:
        type: string
        required: false
        default: override
      server_url:
        type: string
        required: false
        default: ""
    secrets:
      local_password:
        required: false
      ghcr_password:
        required: false
      dockerhub_password:
        required: false
      gitea_token:
        required: false

jobs:
  release:
    name: Build & Push
    runs-on: ${{ inputs.runs_on }}

    steps:
      - name: Checkout
        uses: ${{ inputs.checkout }}
        with:
          fetch-depth: 2 # HEAD + first parent for version compare.

      - name: Setup Rust
        uses: ./.gitea/actions/setup-rust

      - name: Resolve registry env
        id: reg
        env:
          INPUT_LOCAL_REGISTRY: ${{ inputs.local_registry }}
          INPUT_DOCKER_NETWORK: ${{ inputs.docker_network }}
        run: |
          set -euo pipefail

          {
            echo "local_registry=${INPUT_LOCAL_REGISTRY:-${EXTERNAL_SERVER_DOMAIN:-}}"
            echo "docker_network=${INPUT_DOCKER_NETWORK:-${DOCKER_NETWORK:-}}"
          } >> "${GITHUB_OUTPUT}"

      - name: Version & publish decision
        id: meta
        uses: ./.gitea/actions/cargo-publish-meta
        with:
          package_name: ${{ inputs.package_name }}
          manifest_path: ${{ inputs.manifest_path }}
          image_name: ${{ inputs.image_name }}
          force_release: ${{ inputs.force_release }}
          release_marker: ${{ inputs.release_marker }}
          local_registry: ${{ steps.reg.outputs.local_registry }}
          local_user: ${{ inputs.local_user }}
          gh_user: ${{ inputs.gh_user }}
          dh_user: ${{ inputs.dh_user }}

      - name: Publish plan
        id: plan
        if: steps.meta.outputs.changed == 'true'
        env:
          PUBLISH_LOCAL: ${{ inputs.publish_local }}
          PUBLISH_GHCR: ${{ inputs.publish_ghcr }}
          PUBLISH_DOCKERHUB: ${{ inputs.publish_dockerhub }}
          LOCAL_REF: ${{ steps.meta.outputs.local }}
          GHCR_REF: ${{ steps.meta.outputs.ghcr }}
          DOCKER_REF: ${{ steps.meta.outputs.docker }}
          DOCKER_NETWORK: ${{ steps.reg.outputs.docker_network }}
          IMAGE_NAME: ${{ inputs.image_name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: bash "${{ github.workspace }}/.gitea/scripts/publish-plan.sh"

      - name: Setup Buildx
        id: buildx
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/docker-buildx
        with:
          driver-opts: ${{ steps.plan.outputs.driver_opts }}

      - name: Cache mounts
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/buildkit-cache-mounts
        with:
          name: ${{ inputs.image_name }}
          builder: ${{ steps.buildx.outputs.name }}
          dockerfile: ${{ inputs.dockerfile }}
          targets: ${{ inputs.targets }}

      - name: Login (local)
        if: steps.meta.outputs.changed == 'true' && inputs.publish_local
        uses: ./.gitea/actions/docker-login
        with:
          registry: ${{ steps.reg.outputs.local_registry }}
          username: ${{ inputs.local_user }}
          password: ${{ secrets.local_password }}

      - name: Login (GHCR)
        if: steps.meta.outputs.changed == 'true' && inputs.publish_ghcr
        uses: ./.gitea/actions/docker-login
        with:
          registry: ghcr.io
          username: ${{ inputs.gh_user }}
          password: ${{ secrets.ghcr_password }}

      - name: Login (Docker Hub)
        if: steps.meta.outputs.changed == 'true' && inputs.publish_dockerhub
        uses: ./.gitea/actions/docker-login
        with:
          registry: docker.io
          username: ${{ inputs.dh_user }}
          password: ${{ secrets.dockerhub_password }}

      - name: Bake & push
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/docker-bake-push
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          targets: ${{ inputs.targets }}
          version: ${{ steps.meta.outputs.version }}
          revision: ${{ github.sha }}
          package: ${{ inputs.package_name }}
          refs: ${{ steps.plan.outputs.refs }}
          cache-from: ${{ steps.plan.outputs.cache_from }}
          cache-to: ${{ steps.plan.outputs.cache_to }}
          also_latest: ${{ inputs.create_latest_tag }}

      - name: Tag
        if: >-
          inputs.create_tag
          && steps.meta.outputs.changed == 'true'
          && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/gitea-tag
        with:
          version: ${{ steps.meta.outputs.version }}
          prefix: ${{ inputs.tag_prefix }}
          message: ${{ inputs.tag_message }}
          conflict: ${{ inputs.tag_conflict }}
          latest: ${{ inputs.create_latest_tag }}
          token: ${{ secrets.gitea_token }}
          server_url: ${{ inputs.server_url || env.INTERNAL_SERVER_URL }}
