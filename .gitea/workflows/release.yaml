name: Release

on:
  workflow_call:
    inputs:
      checkout:
        type: string
        required: true
      package_name:
        type: string
        required: true
      manifest_path:
        type: string
        required: false
        default: Cargo.toml
      image_name:
        type: string
        required: true
      platforms:
        type: string
        required: true
      local_registry:
        type: string
        required: false
        default: ""
      local_user:
        type: string
        required: true
      gh_user:
        type: string
        required: true
      dh_user:
        type: string
        required: true
      force_release:
        type: boolean
        required: false
        default: false
      release_marker:
        type: string
        required: false
        default: "#release"
      dockerfile:
        type: string
        required: false
        default: "./Dockerfile"
      context:
        type: string
        required: false
        default: "."
      runs_on:
        type: string
        required: false
        default: ubuntu
      docker_network:
        type: string
        required: false
        default: ""
      publish_local:
        type: boolean
        required: false
        default: true
      publish_ghcr:
        type: boolean
        required: false
        default: true
      publish_dockerhub:
        type: boolean
        required: false
        default: true
      registry_cache:
        type: boolean
        required: false
        default: false
      registry_cache_tag:
        type: string
        required: false
        default: cache
      create_tag:
        type: boolean
        required: false
        default: true
      create_latest_tag:
        type: boolean
        required: false
        default: true
      tag_prefix:
        type: string
        required: false
        default: "v"
      tag_message:
        type: string
        required: false
        default: ""
      tag_conflict:
        type: string
        required: false
        default: override
      server_url:
        type: string
        required: false
        default: ""
    secrets:
      local_password:
        required: false
      ghcr_password:
        required: false
      dockerhub_password:
        required: false
      gitea_token:
        required: false

jobs:
  release:
    name: Build & Push
    runs-on: ${{ inputs.runs_on }}

    steps:
      - name: Checkout
        uses: ${{ inputs.checkout }}
        with:
          fetch-depth: 2 # HEAD + first parent for version compare.

      - name: Setup Rust
        uses: ./.gitea/actions/setup-rust

      - name: Resolve registry env
        id: reg
        env:
          INPUT_LOCAL_REGISTRY: ${{ inputs.local_registry }}
          INPUT_DOCKER_NETWORK: ${{ inputs.docker_network }}
        run: |
          set -euo pipefail

          {
            echo "local_registry=${INPUT_LOCAL_REGISTRY:-${EXTERNAL_SERVER_DOMAIN:-}}"
            echo "docker_network=${INPUT_DOCKER_NETWORK:-${DOCKER_NETWORK:-}}"
          } >> "${GITHUB_OUTPUT}"

      - name: Version & publish decision
        id: meta
        uses: ./.gitea/actions/cargo-publish-meta
        with:
          package_name: ${{ inputs.package_name }}
          manifest_path: ${{ inputs.manifest_path }}
          image_name: ${{ inputs.image_name }}
          force_release: ${{ inputs.force_release }}
          release_marker: ${{ inputs.release_marker }}
          local_registry: ${{ steps.reg.outputs.local_registry }}
          local_user: ${{ inputs.local_user }}
          gh_user: ${{ inputs.gh_user }}
          dh_user: ${{ inputs.dh_user }}

      - name: Publish plan
        id: plan
        if: steps.meta.outputs.changed == 'true'
        env:
          PUBLISH_LOCAL: ${{ inputs.publish_local }}
          PUBLISH_GHCR: ${{ inputs.publish_ghcr }}
          PUBLISH_DOCKERHUB: ${{ inputs.publish_dockerhub }}
          REGISTRY_CACHE: ${{ inputs.registry_cache }}
          REGISTRY_CACHE_TAG: ${{ inputs.registry_cache_tag }}
          LOCAL_REF: ${{ steps.meta.outputs.local }}
          GHCR_REF: ${{ steps.meta.outputs.ghcr }}
          DOCKER_REF: ${{ steps.meta.outputs.docker }}
          VERSION: ${{ steps.meta.outputs.version }}
          DOCKER_NETWORK: ${{ steps.reg.outputs.docker_network }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail

          any=false
          tags=()

          add_tags() {
            any=true
            tags+=("${1}:${VERSION}" "${1}:latest")
          }

          if [ "${PUBLISH_LOCAL}" = "true" ]; then
            add_tags "${LOCAL_REF}"
          fi
          if [ "${PUBLISH_GHCR}" = "true" ]; then
            add_tags "${GHCR_REF}"
          fi
          if [ "${PUBLISH_DOCKERHUB}" = "true" ]; then
            add_tags "${DOCKER_REF}"
          fi

          driver_opts="${DOCKER_NETWORK:+network=${DOCKER_NETWORK}}"

          cache_from=("type=gha,scope=${IMAGE_NAME}")
          cache_to=("type=gha,mode=max,scope=${IMAGE_NAME}")
          if [ "${REGISTRY_CACHE}" = "true" ] && [ "${PUBLISH_LOCAL}" = "true" ] && [ -n "${LOCAL_REF}" ]; then
            cache_tag="${REGISTRY_CACHE_TAG:-cache}"
            cache_from+=("type=registry,ref=${LOCAL_REF}:${cache_tag},ignore-error=true")
            cache_to+=("type=registry,ref=${LOCAL_REF}:${cache_tag},mode=max,ignore-error=true")
          fi

          {
            echo "any=${any}"
            echo "driver_opts=${driver_opts}"
            echo "tags<<EOF"
            ((${#tags[@]})) && printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "cache_from<<EOF"
            printf '%s\n' "${cache_from[@]}"
            echo "EOF"
            echo "cache_to<<EOF"
            printf '%s\n' "${cache_to[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Buildx
        id: buildx
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/docker-buildx
        with:
          driver-opts: ${{ steps.plan.outputs.driver_opts }}

      - name: Cache mounts
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/buildkit-cache-mounts
        with:
          builder: ${{ steps.buildx.outputs.name }}
          dockerfile: ${{ inputs.dockerfile }}

      - name: Login (local)
        if: steps.meta.outputs.changed == 'true' && inputs.publish_local
        uses: ./.gitea/actions/docker-login
        with:
          registry: ${{ steps.reg.outputs.local_registry }}
          username: ${{ inputs.local_user }}
          password: ${{ secrets.local_password }}

      - name: Login (GHCR)
        if: steps.meta.outputs.changed == 'true' && inputs.publish_ghcr
        uses: ./.gitea/actions/docker-login
        with:
          registry: ghcr.io
          username: ${{ inputs.gh_user }}
          password: ${{ secrets.ghcr_password }}

      - name: Login (Docker Hub)
        if: steps.meta.outputs.changed == 'true' && inputs.publish_dockerhub
        uses: ./.gitea/actions/docker-login
        with:
          registry: docker.io
          username: ${{ inputs.dh_user }}
          password: ${{ secrets.dockerhub_password }}

      - name: Build & push
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/docker-build-push
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            PACKAGE=${{ inputs.package_name }}
          tags: ${{ steps.plan.outputs.tags }}
          cache-from: ${{ steps.plan.outputs.cache_from }}
          cache-to: ${{ steps.plan.outputs.cache_to }}

      - name: Tag
        if: >-
          inputs.create_tag
          && steps.meta.outputs.changed == 'true'
          && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/gitea-tag
        with:
          version: ${{ steps.meta.outputs.version }}
          prefix: ${{ inputs.tag_prefix }}
          message: ${{ inputs.tag_message }}
          conflict: ${{ inputs.tag_conflict }}
          latest: ${{ inputs.create_latest_tag }}
          token: ${{ secrets.gitea_token }}
          server_url: ${{ inputs.server_url || env.INTERNAL_SERVER_URL }}
