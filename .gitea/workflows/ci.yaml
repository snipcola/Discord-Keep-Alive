name: CI
run-name: ${{ gitea.event_name == 'workflow_dispatch' && format('Manual{0}{1}{2}', inputs.dry_run && ' (dry run)' || '', inputs.release && ' (forced)' || '', inputs.commit && format(' @ {0}', inputs.commit) || '') || '' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Git commit, branch, or tag
        type: string
        required: false
        default: ""
      release:
        description: Force release
        type: boolean
        required: false
        default: false
      dry_run:
        description: Dry run
        type: boolean
        required: false
        default: false
      latest_ci:
        description: Use current CI
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.event.pull_request.number || gitea.ref }}
  cancel-in-progress: ${{ gitea.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu
    permissions:
      contents: write
      packages: write
    env:
      TARGETS: |
        linux/arm64=aarch64-unknown-linux-musl
        linux/amd64=x86_64-unknown-linux-musl
        darwin/arm64=aarch64-apple-darwin
        darwin/amd64=x86_64-apple-darwin
        windows/arm64=aarch64-pc-windows-gnullvm
        windows/amd64=x86_64-pc-windows-gnu
      BUILD_DIR: build
    steps:
      - name: Checkout
        uses: builtin:checkout
        with:
          ref: ${{ inputs.commit || gitea.sha }}
          fetch-depth: 2 # HEAD and its parent, to compare versions.

      - name: Get latest CI
        if: inputs.latest_ci
        env:
          WORKFLOW_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${WORKFLOW_SHA}"
          git checkout "${WORKFLOW_SHA}" -- .gitea

      - name: Setup environment
        uses: ./.gitea/actions/setup-env
        with:
          targets: ${{ env.TARGETS }}
          tools: cargo-deny, cargo-shear

      - name: Version & publish decision
        id: meta
        if: >-
          (gitea.event_name == 'push' && gitea.ref_name == 'main') || gitea.event_name == 'workflow_dispatch'
        uses: ./.gitea/actions/cargo-publish-meta
        with:
          force_release: ${{ inputs.release || inputs.dry_run }}
          base: ${{ gitea.event_name == 'push' && gitea.event.before || '' }}
          gh_user: ${{ vars.GH_USERNAME }}
          dh_user: ${{ vars.DH_USERNAME }}

      - name: Changes
        id: changes
        env:
          BASE: ${{ gitea.event.pull_request.base.sha || gitea.event.before }}
          RELEASE: ${{ steps.meta.outputs.changed }}
          DOCS_ONLY: |
            .editorconfig
            .gitignore
            about.hbs
            about.toml
            config.example.toml
            docker-compose.example.yaml
            Dockerfile
            LICENSE
            README.md
        run: bash "${{ gitea.workspace }}/.gitea/scripts/changes.sh"

      - name: Cache host target
        id: host-cache
        if: steps.changes.outputs.checks == 'true'
        uses: ./.gitea/actions/cargo-target-cache
        with:
          targets: ""
          key: host

      - name: Format
        if: steps.changes.outputs.checks == 'true'
        run: cargo fc

      - name: Clippy, deny & shear
        if: steps.changes.outputs.checks == 'true'
        run: bash "${{ gitea.workspace }}/.gitea/scripts/lint.sh"

      - name: Test
        if: steps.changes.outputs.checks == 'true'
        run: cargo t

      - name: Prune host target
        if: steps.host-cache.outputs.cache-hit == 'false'
        env:
          PROFILES: ${{ steps.host-cache.outputs.profiles }}
        run: |
          set -euo pipefail
          {
            cargo ck --message-format=json-render-diagnostics
            cargo t --no-run --message-format=json-render-diagnostics
          } | bash "${{ gitea.workspace }}/.gitea/scripts/prune-target.sh"

      - name: Publish plan
        id: plan
        if: steps.meta.outputs.changed == 'true'
        env:
          PUBLISH_LOCAL: true
          PUBLISH_GHCR: true
          PUBLISH_DOCKERHUB: true
          LOCAL_REF: ${{ steps.meta.outputs.local }}
          GHCR_REF: ${{ steps.meta.outputs.ghcr }}
          DOCKER_REF: ${{ steps.meta.outputs.docker }}
        run: bash "${{ gitea.workspace }}/.gitea/scripts/publish-plan.sh"

      - name: Setup build tools
        if: steps.meta.outputs.changed == 'true'
        uses: ./.gitea/actions/setup-env
        with:
          rust: "false"
          tools: cargo-about, cargo-zigbuild

      # Only runs that build release targets write this cache entry.
      - name: Cache release targets
        id: release-cache
        if: steps.meta.outputs.changed == 'true'
        uses: ./.gitea/actions/cargo-target-cache
        with:
          targets: ${{ env.TARGETS }}
          key: release

      - name: Binaries & licences
        id: build
        if: steps.meta.outputs.changed == 'true'
        env:
          PACKAGE: ${{ steps.meta.outputs.package_name }}
        run: |
          set -euo pipefail
          scripts="${{ gitea.workspace }}/.gitea/scripts"
          source "${scripts}/common.sh"

          # Licence generation only takes CPU the build leaves idle.
          bg_start Licences nice -n 10 bash "${scripts}/licences.sh"

          bash "${scripts}/build-binaries.sh"
          bg_wait

      - name: Prune release targets
        if: steps.release-cache.outputs.cache-hit == 'false'
        env:
          PROFILES: ${{ steps.release-cache.outputs.profiles }}
        run: bash "${{ gitea.workspace }}/.gitea/scripts/prune-target.sh" <"${{ steps.build.outputs.units }}"

      - name: Package
        if: steps.meta.outputs.changed == 'true'
        env:
          PACKAGE: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash "${{ gitea.workspace }}/.gitea/scripts/package.sh"

      - name: Setup Buildx
        id: buildx
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/docker-buildx
        with:
          driver-opts: ${{ steps.plan.outputs.driver_opts }}

      - name: Login
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true' && !inputs.dry_run
        uses: ./.gitea/actions/docker-login
        with:
          registry-auth: |
            - registry: ${{ steps.meta.outputs.local_registry }}
              username: ${{ steps.meta.outputs.local_user }}
              password: ${{ toJSON(secrets.AUTH || gitea.token) }}
            - registry: ghcr.io
              username: ${{ vars.GH_USERNAME }}
              password: ${{ toJSON(secrets.GH_AUTH) }}
            - registry: docker.io
              username: ${{ vars.DH_USERNAME }}
              password: ${{ toJSON(secrets.DH_AUTH) }}

      - name: Bake & push
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/docker-bake-push
        with:
          build_dir: ${{ env.BUILD_DIR }}
          file: ./Dockerfile
          targets: ${{ env.TARGETS }}
          version: ${{ steps.meta.outputs.version }}
          revision: ${{ inputs.commit || gitea.sha }}
          package: ${{ steps.meta.outputs.package_name }}
          source: ${{ steps.meta.outputs.repository }}
          licence: ${{ steps.meta.outputs.licence }}
          refs: ${{ steps.plan.outputs.refs }}
          push: ${{ !inputs.dry_run }}

      - name: Tag
        id: tag
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true' && !inputs.dry_run
        uses: ./.gitea/actions/gitea-tag
        with:
          version: ${{ steps.meta.outputs.version }}
          target: ${{ inputs.commit || gitea.sha }}

      - name: Release
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true' && !inputs.dry_run
        uses: ./.gitea/actions/gitea-release
        with:
          version: ${{ steps.meta.outputs.version }}
          tag: ${{ steps.tag.outputs.tag }}
          package: ${{ steps.meta.outputs.package_name }}
          build_dir: ${{ env.BUILD_DIR }}
          targets: ${{ env.TARGETS }}
          repo_url: ${{ steps.meta.outputs.repository }}

      - name: Summary
        if: always() && steps.meta.conclusion == 'success'
        env:
          PACKAGE: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANGED: ${{ steps.meta.outputs.changed }}
          REASON: ${{ steps.meta.outputs.reason }}
          TAG: ${{ steps.tag.outputs.tag }}
          REVISION: ${{ inputs.commit || gitea.sha }}
          REFS: ${{ steps.plan.outputs.refs }}
          DRY_RUN: ${{ inputs.dry_run }}
          FAILED: ${{ contains(job.status, 'failure') }}
        run: bash "${{ gitea.workspace }}/.gitea/scripts/summary.sh"
