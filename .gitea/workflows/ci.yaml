name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Force image publish even without version bump or release marker
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # PRs only: never cancel a main/manual publish mid-run.

jobs:
  check:
    uses: ./.gitea/workflows/check.yaml

  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    uses: ./.gitea/workflows/release.yaml
    with:
      package_name: discord-keep-alive
      image_name: discord-keep-alive
      platforms: linux/amd64,linux/arm64
      local_user: ${{ vars.USERNAME }}
      gh_user: ${{ vars.GH_USERNAME }}
      dh_user: ${{ vars.DH_USERNAME }}
      force_release: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || false }}
    secrets:
      local_password: ${{ secrets.AUTH }}
      ghcr_password: ${{ secrets.GH_AUTH }}
      dockerhub_password: ${{ secrets.DH_AUTH }}
