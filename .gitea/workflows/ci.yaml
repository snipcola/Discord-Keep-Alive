name: CI
run-name: ${{ gitea.event_name == 'workflow_dispatch' && format('Manual{0}{1}{2}', inputs.dry_run && ' (dry run)' || '', inputs.release && ' (forced)' || '', inputs.commit && format(' @ {0}', inputs.commit) || '') || '' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Git commit, branch, or tag
        type: string
        required: false
        default: ""
      release:
        description: Force release
        type: boolean
        required: false
        default: false
      dry_run:
        description: Dry run
        type: boolean
        required: false
        default: false
      latest_ci:
        description: Use current CI
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.event.pull_request.number || gitea.ref }}
  cancel-in-progress: ${{ gitea.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu
    permissions:
      contents: write
      packages: write
    env:
      TARGETS: |
        linux/amd64=x86_64-unknown-linux-musl
        linux/arm64=aarch64-unknown-linux-musl
      DIST_DIR: dist
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || gitea.sha }}
          fetch-depth: 2 # HEAD + first parent for version compare.

      - name: Get latest CI
        if: inputs.latest_ci
        env:
          WORKFLOW_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${WORKFLOW_SHA}"
          git checkout "${WORKFLOW_SHA}" -- .gitea

      - name: Setup environment
        uses: ./.gitea/actions/setup-env
        with:
          targets: ${{ env.TARGETS }}
          tools: cargo-deny, cargo-shear

      - name: Cache host target
        uses: ./.gitea/actions/cargo-target-cache
        with:
          targets: ""
          key: host

      - name: Deny
        run: cargo deny check -D warnings --hide-inclusion-graph

      - name: Shear
        run: cargo shear --locked --deny-warnings

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --all-features

      - name: Version & publish decision
        id: meta
        if: >-
          (gitea.event_name == 'push' && gitea.ref_name == 'main') || gitea.event_name == 'workflow_dispatch'
        uses: ./.gitea/actions/cargo-publish-meta
        with:
          force_release: ${{ inputs.release || inputs.dry_run }}
          gh_user: ${{ vars.GH_USERNAME }}
          dh_user: ${{ vars.DH_USERNAME }}

      - name: Publish plan
        id: plan
        if: steps.meta.outputs.changed == 'true'
        env:
          PUBLISH_LOCAL: true
          PUBLISH_GHCR: true
          PUBLISH_DOCKERHUB: true
          LOCAL_REF: ${{ steps.meta.outputs.local }}
          GHCR_REF: ${{ steps.meta.outputs.ghcr }}
          DOCKER_REF: ${{ steps.meta.outputs.docker }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: bash "${{ gitea.workspace }}/.gitea/scripts/publish-plan.sh"

      - name: Setup build tools
        if: steps.meta.outputs.changed == 'true'
        uses: ./.gitea/actions/setup-env
        with:
          rust: "false"
          tools: cargo-zigbuild

      # Gated so only runs that build these ever write the entry.
      - name: Cache release targets
        if: steps.meta.outputs.changed == 'true'
        uses: ./.gitea/actions/cargo-target-cache
        with:
          targets: ${{ env.TARGETS }}
          key: release

      - name: Build binaries
        if: steps.meta.outputs.changed == 'true'
        env:
          PACKAGE: ${{ steps.meta.outputs.package_name }}
        run: bash "${{ gitea.workspace }}/.gitea/scripts/build-binaries.sh"

      - name: Setup Buildx
        id: buildx
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/docker-buildx
        with:
          driver-opts: ${{ steps.plan.outputs.driver_opts }}

      - name: Login (local)
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true' && !inputs.dry_run
        uses: ./.gitea/actions/docker-login
        with:
          registry: ${{ steps.meta.outputs.local_registry }}
          username: ${{ steps.meta.outputs.local_user }}
          password: ${{ secrets.AUTH || gitea.token }}

      - name: Login (GHCR)
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true' && !inputs.dry_run
        uses: ./.gitea/actions/docker-login
        with:
          registry: ghcr.io
          username: ${{ vars.GH_USERNAME }}
          password: ${{ secrets.GH_AUTH }}

      - name: Login (Docker Hub)
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true' && !inputs.dry_run
        uses: ./.gitea/actions/docker-login
        with:
          registry: docker.io
          username: ${{ vars.DH_USERNAME }}
          password: ${{ secrets.DH_AUTH }}

      - name: Bake & push
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true'
        uses: ./.gitea/actions/docker-bake-push
        with:
          context: .
          file: ./Dockerfile
          targets: ${{ env.TARGETS }}
          version: ${{ steps.meta.outputs.version }}
          revision: ${{ inputs.commit || gitea.sha }}
          package: ${{ steps.meta.outputs.package_name }}
          source: ${{ steps.meta.outputs.repository }}
          license: ${{ steps.meta.outputs.license }}
          refs: ${{ steps.plan.outputs.refs }}
          cache-from: ${{ steps.plan.outputs.cache_from }}
          cache-to: ${{ steps.plan.outputs.cache_to }}
          push: ${{ !inputs.dry_run }}

      - name: Tag
        id: tag
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true' && !inputs.dry_run
        uses: ./.gitea/actions/gitea-tag
        with:
          version: ${{ steps.meta.outputs.version }}
          target: ${{ inputs.commit || gitea.sha }}

      - name: Release
        if: steps.meta.outputs.changed == 'true' && steps.plan.outputs.any == 'true' && !inputs.dry_run
        uses: ./.gitea/actions/gitea-release
        with:
          version: ${{ steps.meta.outputs.version }}
          tag: ${{ steps.tag.outputs.tag }}
          package: ${{ steps.meta.outputs.package_name }}
          dist_dir: ${{ env.DIST_DIR }}
          targets: ${{ env.TARGETS }}
          repo_url: ${{ steps.meta.outputs.repository }}

      - name: Summary
        if: always() && steps.meta.conclusion == 'success'
        env:
          PACKAGE: ${{ steps.meta.outputs.package_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANGED: ${{ steps.meta.outputs.changed }}
          REASON: ${{ steps.meta.outputs.reason }}
          TAG: ${{ steps.tag.outputs.tag }}
          REVISION: ${{ inputs.commit || gitea.sha }}
          REFS: ${{ steps.plan.outputs.refs }}
          DRY_RUN: ${{ inputs.dry_run }}
          FAILED: ${{ contains(job.status, 'failure') }}
        run: bash "${{ gitea.workspace }}/.gitea/scripts/summary.sh"
