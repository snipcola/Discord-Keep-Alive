name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Force image publish even without version bump or release marker
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.event.pull_request.number || gitea.ref }}
  cancel-in-progress: ${{ gitea.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.gitea/workflows/check.yaml
    with:
      checkout: &checkout actions/checkout@v7.0.1

  release:
    needs: check
    if: >-
      (gitea.event_name == 'push' && gitea.ref_name == 'main') || gitea.event_name == 'workflow_dispatch'
    uses: ./.gitea/workflows/release.yaml
    with:
      checkout: *checkout
      targets: |
        linux/amd64=x86_64-unknown-linux-musl
        linux/arm64=aarch64-unknown-linux-musl
      gh_user: ${{ vars.GH_USERNAME }}
      dh_user: ${{ vars.DH_USERNAME }}
      force_release: ${{ (gitea.event_name == 'workflow_dispatch' && inputs.release) || false }}
    secrets:
      ghcr_password: ${{ secrets.GH_AUTH }}
      dockerhub_password: ${{ secrets.DH_AUTH }}
