name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Push
    runs-on: ubuntu

    env:
      NAME: discord-keep-alive
      PLATFORMS: linux/amd64,linux/arm64

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.rustup
          key: rustup-toolchain-${{ hashFiles('rust-toolchain.toml') }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0

      - name: Resolve version & image names
        id: meta
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "discord-keep-alive") | .version')"
          test -n "${version}" && test "${version}" != "null"
          {
            echo "version=${version}"
            echo "local=${EXTERNAL_SERVER_DOMAIN}/${{ vars.USERNAME }}/${NAME}"
            echo "ghcr=ghcr.io/${{ vars.GH_USERNAME }}/${NAME}"
            echo "docker=docker.io/${{ vars.DH_USERNAME }}/${NAME}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v4.2.0
        with:
          driver-opts: |
            network=${{ env.DOCKER_NETWORK }}

      - name: Login to local registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.EXTERNAL_SERVER_DOMAIN }}
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.AUTH }}

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GH_USERNAME }}
          password: ${{ secrets.GH_AUTH }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DH_USERNAME }}
          password: ${{ secrets.DH_AUTH }}

      - name: Build & push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.local }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.local }}:latest
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr }}:latest
            ${{ steps.meta.outputs.docker }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.docker }}:latest
          cache-from: type=gha,scope=${{ env.NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.NAME }}
