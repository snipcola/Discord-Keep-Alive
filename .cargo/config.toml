[alias]
b = "build --locked"
br = "build --release --locked"
zb = "zigbuild --locked"
zbr = "zigbuild --release --locked"
r = "run --locked"
rr = "run --release --locked"
c = "clippy --workspace --all-targets --all-features --locked -- -D warnings"
ck = "check --workspace --all-features --all-targets --locked"
f = "fmt --all"
fc = "fmt --all --check"
t = "test --workspace --all-features --locked"
d = "doc --workspace --no-deps --open --locked"
u = "upgrade --incompatible"
sh = "shear --deny-warnings --locked"
dn = "deny check -D warnings --hide-inclusion-graph"
