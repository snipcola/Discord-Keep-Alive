[alias]
b = "build --locked"
br = "build --release --locked"
zb = "zigbuild --locked"
zbr = "zigbuild --release --locked"
r = "run --locked"
rr = "run --release --locked"
c = "clippy --workspace --all-targets --all-features --locked -- -D warnings"
ck = "check --workspace --all-features --all-targets --locked"
f = "fmt --all"
fc = "fmt --all --check"
t = "test --workspace --all-features --locked"
nt = "nextest run --workspace --all-features --locked"
d = "doc --workspace --no-deps --open --locked"
up = "update"
ug = "upgrade --incompatible"
v = "set-version --workspace"
vb = "set-version --workspace --bump"
sh = "shear --deny-warnings --locked"
bl = "bloat --release --all-features --locked"
blc = "bloat --release --all-features --locked --crates"
dn = "deny --config .config/deny.toml check -D warnings --hide-inclusion-graph"
ab = "about generate --config .config/about.toml --workspace --all-features --locked --fail .config/about.hbs"
